name = "loop-rag-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Workers AI binding — runs the embedding and completion models on
# Cloudflare's own compute, not this laptop. Free tier: a daily allotment of
# "neurons" (Cloudflare's compute-time unit), no card required to start.
[ai]
binding = "AI"

# Vectorize binding — Cloudflare's managed vector database. Free tier
# includes a generous per-account quota of stored vectors and queries.
# The index itself is created separately via `wrangler vectorize create`
# (see README.md in this directory) before the first deploy.
[[vectorize]]
binding = "VECTORIZE"
index_name = "loop-rag-index"

# KV binding — a small document manifest (doc_id -> full text + metadata),
# separate from Vectorize. Exists because Vectorize has no "list all
# documents" or "fetch by exact ID" API of its own — it's pure vector
# similarity search, and a metadata-filtered query still needs a query
# vector and is capped by topK, so it can't reliably return *all* chunks
# for one document. Storing the original full text here instead makes
# GET /documents and GET /documents/:id exact and independent of Vectorize
# entirely — see src/index.ts.
[[kv_namespaces]]
binding = "DOCUMENTS"
id = "1bf23f9583294c8c821d80889b72fdb6"
